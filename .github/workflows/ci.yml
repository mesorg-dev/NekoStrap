name: ci

# Сборка + дымовой тест на каждый push/PR: ловим сломанный UI до релиза.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build solution
        run: dotnet build NekoStrap.sln -c Release --nologo

      - name: Smoke tests (UI + logic)
        shell: pwsh
        run: |
          $out = dotnet run --project NekoStrap.Smoke -c Release --no-build 2>&1 | Tee-Object -FilePath smoke.log
          $out | Select-Object -Last 80
          exit $LASTEXITCODE

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log
          if-no-files-found: ignore
