name: ci

# Сборка + дымовой тест на каждый push/PR: ловим сломанный UI до релиза.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build solution
        run: dotnet build NekoStrap.sln -c Release --nologo

      - name: Smoke tests (UI + logic)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'smoke.log'
          $err = Join-Path $env:RUNNER_TEMP 'smoke.err'
          $p = Start-Process -FilePath 'dotnet' `
            -ArgumentList @('run','--project','NekoStrap.Smoke','-c','Release','--no-build') `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError $err
          $lines = @()
          if (Test-Path $log) { $lines += Get-Content $log }
          if (Test-Path $err) { $lines += Get-Content $err }
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Set-Content smoke-out.txt
          if ($p.ExitCode -ne 0) {
            $tail = ($lines | Select-Object -Last 50) -join '%0A'
            Write-Host "::error title=Smoke exit $($p.ExitCode)::$tail"
          }
          exit $p.ExitCode

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke-out.txt
          if-no-files-found: ignore
